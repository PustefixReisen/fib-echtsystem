<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 360" role="img" aria-label="Feldkirchen im Blick Banner"><rect width="1600" height="360" fill="#FAF8F3"/><text x="60" y="112" font-family="Inter,Arial,sans-serif" font-size="72" font-weight="700" fill="#064E40">Feldkirchen</text><text x="430" y="112" font-family="Inter,Arial,sans-serif" font-size="72" fill="#064E40">im Blick</text><text x="60" y="172" font-family="Inter,Arial,sans-serif" font-size="38" font-weight="700" fill="#16355F">Mehr Überblick. Besser verstehen.</text><text x="60" y="220" font-family="Inter,Arial,sans-serif" font-size="24" fill="#16355F">Relevante Informationen aus Rathaus, Presse und weiteren Quellen –</text><text x="60" y="253" font-family="Inter,Arial,sans-serif" font-size="24" fill="#16355F">verständlich zusammengeführt und in ihren Zusammenhängen erklärt.</text><g transform="translate(850 20)"><g fill="#E7F4F6"><ellipse cx="210" cy="52" rx="75" ry="24"/><ellipse cx="330" cy="45" rx="82" ry="28"/><ellipse cx="500" cy="55" rx="90" ry="25"/></g><path d="M0 245 C150 210 300 232 410 214 C525 196 610 230 700 216" fill="none" stroke="#BFE3D1" stroke-width="52" opacity=".55"/><polygon points="130,105 340,90 340,258 130,258" fill="#C86A3F" stroke="#8C4C37" stroke-width="1.5"/><line x1="130" y1="105" x2="340" y2="90" stroke="#6E3B2B" stroke-width="3"/><rect x="240" y="135" width="78" height="82" fill="#5B93B0"/><g stroke="#FAF8F3" stroke-width="3"><line x1="260" y1="135" x2="260" y2="217"/><line x1="280" y1="135" x2="280" y2="217"/><line x1="300" y1="135" x2="300" y2="217"/></g><g fill="#3B4546"><rect x="150" y="222" width="30" height="36"/><rect x="193" y="222" width="30" height="36"/><rect x="236" y="222" width="30" height="36"/><rect x="279" y="222" width="30" height="36"/></g><g stroke="#AEB8B8" stroke-width="3"><line x1="244" y1="78" x2="244" y2="270"/><line x1="272" y1="78" x2="272" y2="270"/><line x1="300" y1="78" x2="300" y2="270"/><line x1="328" y1="78" x2="328" y2="270"/></g><g tra