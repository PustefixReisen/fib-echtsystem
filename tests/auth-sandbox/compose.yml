name: fib-pr74-auth-test
services:
  db:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_PASSWORD: ${TEST_DB_PASSWORD:?ephemeral password required}
      POSTGRES_DB: auth_test
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/01-auth.sql:ro
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d auth_test]
      interval: 2s
      timeout: 5s
      retries: 30
    networks: [isolated]
  mail:
    image: axllent/mailpit:v1.31.5
    ports: ["127.0.0.1:54324:8025"]
    networks: [isolated]
  auth:
    image: supabase/gotrue:v2.197.0
    depends_on:
      db:
        condition: service_healthy
    ports: ["127.0.0.1:9999:9999"]
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://127.0.0.1:54321/auth/v1
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${TEST_DB_PASSWORD}@db:5432/auth_test
      GOTRUE_DB_NAMESPACE: auth
      GOTRUE_SITE_URL: http://127.0.0.1:4173
      GOTRUE_URI_ALLOW_LIST: http://127.0.0.1:4173
      GOTRUE_JWT_SECRET: ${TEST_JWT_SECRET:?ephemeral secret required}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "false"
      GOTRUE_MAILER_SECURE_EMAIL_CHANGE_ENABLED: "true"
      GOTRUE_SECURITY_UPDATE_PASSWORD_REQUIRE_REAUTHENTICATION: "true"
      GOTRUE_PASSWORD_MIN_LENGTH: 12
      GOTRUE_SMTP_HOST: mail
      GOTRUE_SMTP_PORT: 1025
      GOTRUE_SMTP_ADMIN_EMAIL: auth@example.test
      GOTRUE_SMTP_SENDER_NAME: FIB isolated Auth test
      GOTRUE_SMTP_MAX_FREQUENCY: 1s
      GOTRUE_RATE_LIMIT_EMAIL_SENT: 1000
      GOTRUE_RATE_LIMIT_VERIFY: 1000
      GOTRUE_RATE_LIMIT_TOKEN_REFRESH: 1000
      GOTRUE_RATE_LIMIT_SIGN_IN_SIGN_UPS: 1000
      GOTRUE_MAILER_URLPATHS_CONFIRMATION: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_RECOVERY: /auth/v1/verify
      GOTRUE_MAILER_URLPATHS_EMAIL_CHANGE: /auth/v1/verify
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_MFA_MAX_ENROLLED_FACTORS: 3
      GOTRUE_LOG_LEVEL: error
    networks: [isolated]
networks:
  isolated:
    internal: true
