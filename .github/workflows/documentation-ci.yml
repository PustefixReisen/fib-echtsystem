name: Documentation CI
on:
  pull_request:
    paths:
      - 'docs/**.md'
      - 'docs/**/*.md'
      - '.github/workflows/documentation-ci.yml'
permissions:
  contents: read
jobs:
  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whitespace and conflict markers in the diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: git diff --check "$BASE_SHA" HEAD
      - name: Check changed Markdown, local links and stable rule identifiers
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          python3 - <<'PY'
          import os, re, subprocess
          from pathlib import Path
          from urllib.parse import unquote, urlsplit

          base = os.environ['BASE_SHA']
          changed = subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=ACMR', base, 'HEAD'], text=True
          ).splitlines()
          documents = [Path(name) for name in changed if name.endswith('.md')]
          errors = []
          links = 0
          rules = re.compile(r'\*\*(FIB-[A-Z0-9-]+-\d{3})\s*[–—]')
          for path in documents:
              text = path.read_text(encoding='utf-8')
              if re.search(r'^(<<<<<<< |=======$|>>>>>>> )', text, re.M):
                  errors.append(f'{path}: unresolved merge marker')
              if len(re.findall(r'^```', text, re.M)) % 2:
                  errors.append(f'{path}: unclosed fenced block')
              if text.count('<details>') != text.count('</details>'):
                  errors.append(f'{path}: unclosed details block')
              # Inline Markdown links, including images. Remote links and fragments
              # are not fetched, so documentation CI needs no external credentials.
              for target in re.findall(r'\]\(([^\s)]+)\)', text):
                  url = urlsplit(target.strip('<>'))
                  if url.scheme or url.netloc or not url.path:
                      continue
                  links += 1
                  destination = path.parent / unquote(url.path)
                  if not destination.exists():
                      errors.append(f'{path}: missing local target {target}')
              old = subprocess.run(
                  ['git', 'show', f'{base}:{path.as_posix()}'],
                  capture_output=True, text=True
              )
              if old.returncode == 0:
                  removed = set(rules.findall(old.stdout)) - set(rules.findall(text))
                  if removed:
                      errors.append(f'{path}: removed rule identifiers {sorted(removed)}')
          if not documents:
              print('No Markdown changes to check.')
          if errors:
              raise SystemExit('\n'.join(errors))
          print(f'PASS {len(documents)} Markdown files, {links} local links, block structure and stable rule identifiers')
          PY
