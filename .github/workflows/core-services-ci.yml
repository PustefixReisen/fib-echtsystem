name: Core Services CI

on:
  pull_request:
    paths:
      - 'packages/**'
      - 'tests/**'
      - 'supabase/schema/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/core-services-ci.yml'
  push:
    branches: [main]
    paths:
      - 'packages/**'
      - 'tests/**'
      - 'supabase/schema/**'
      - 'supabase/migrations/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig.base.json'
      - '.github/workflows/core-services-ci.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install
      - name: Typecheck repository
        run: npm run typecheck
      - name: Run fachservice cases
        run: npm run test:fachservices
