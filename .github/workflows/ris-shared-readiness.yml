name: RIS Shared-Apps deployment preparation
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/ris-shared-apps/**'
      - 'tests/u4/ris-shared-deployment-postgres.spec.ts'
      - 'tests/u4/fib-schema-restore.mjs'
      - 'tests/u4/ris-shared-operator-guards.mjs'
      - '.github/workflows/ris-shared-readiness.yml'
permissions:
  contents: read
jobs:
  shared-preparation:
    strategy:
      fail-fast: false
      matrix:
        postgres: ['16', '17']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_PASSWORD: integration_only
          POSTGRES_DB: fib_u4_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 5s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - name: Private operator output and target guards
        run: node tests/u4/ris-shared-operator-guards.mjs
      - name: Ownership, cleanup and Memorix isolation under actual PostgreSQL major
        env:
          U4_TEST_DATABASE_URL: postgres://postgres:integration_only@127.0.0.1:5432/fib_u4_test
        run: node --import tsx tests/u4/ris-shared-deployment-postgres.spec.ts
      - name: Isolated schema-specific backup and restore with matching client major
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
          U4_TEST_DATABASE_URL: postgres://postgres:integration_only@127.0.0.1:5432/fib_u4_test
        run: |
          umask 077
          mkdir -p "$RUNNER_TEMP/fib-pg-client"
          cat > "$RUNNER_TEMP/fib-pg-client/pg_dump" <<'SH'
          #!/bin/sh
          exec docker exec -e PGHOST -e PGPORT -e PGUSER -e PGPASSWORD -e PGDATABASE -e PGSSLMODE "$PG_CONTAINER" pg_dump "$@"
          SH
          chmod 700 "$RUNNER_TEMP/fib-pg-client/pg_dump"
          export PATH="$RUNNER_TEMP/fib-pg-client:$PATH"
          export FIB_BACKUP_DIR="$RUNNER_TEMP/fib-private-backup"
          node scripts/ris-shared-apps/backup.mjs --out="$FIB_BACKUP_DIR"
          node tests/u4/fib-schema-restore.mjs
