name: U4 Reference Administration PostgreSQL

on:
  pull_request:
    paths:
      - 'supabase/migrations/*research_reference_admin.sql'
      - 'tests/sql/research-reference-invariants.sql'
      - '.github/workflows/reference-admin-postgres.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema-and-rls:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: fib_reference_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d fib_reference_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: fib_reference_test
    steps:
      - uses: actions/checkout@v4
      - name: Create isolated Shared-Apps-compatible roles
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          create schema auth;
          create table auth.users(id uuid primary key);
          create schema fib;
          create role fib_runtime;
          create role anon;
          create role authenticated;
          create role service_role;
          grant usage on schema fib to fib_runtime;
          SQL
      - name: Apply reference admin migration in isolation
        run: psql -v ON_ERROR_STOP=1 -f supabase/migrations/20261104143000_fib_research_reference_admin.sql
      - name: Verify proposed/confirmed reference boundaries and privileges
        run: psql -v ON_ERROR_STOP=1 -f tests/sql/research-reference-invariants.sql
