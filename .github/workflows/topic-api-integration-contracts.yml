name: Topic API Integration Contracts

on:
  pull_request:
    paths:
      - 'supabase/functions/fib-topic-editor/**'
      - 'scripts/test-topic-api-integration-contracts.mjs'
      - '.github/workflows/topic-api-integration-contracts.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/functions/fib-topic-editor/**'
      - 'scripts/test-topic-api-integration-contracts.mjs'
      - '.github/workflows/topic-api-integration-contracts.yml'

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test scripts/test-topic-api-integration-contracts.mjs
