name: FIB Edge source readiness - read only

# Standalone check; never deploy, alter secrets, publish source files or grant release.
on:
  pull_request:
    paths:
      - 'scripts/backup/read-only-edge-check.py'
      - 'tests/backup/read-only-edge-check.test.py'
      - 'scripts/backup/check-edge-isolated.py'
      - 'tests/backup/check-edge-isolated.test.py'
      - '.github/workflows/fib-edge-readonly.yml'
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type CHECK for a read-only deployed FIB source audit'
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: fib-edge-source-readonly
  cancel-in-progress: false

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test fail-closed source checker
        run: |
          python3 tests/backup/read-only-edge-check.test.py
          python3 tests/backup/check-edge-isolated.test.py

  isolated-deno-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.5.6
      - name: Isolated Deno typecheck on synthetic source only
        shell: bash
        run: |
          set -euo pipefail
          path="$(mktemp -d)"
          trap 'rm -rf "$path"' EXIT
          mkdir -p "$path/fib-test"
          echo 'export const value: number = 1;' > "$path/fib-test/index.ts"
          python3 scripts/backup/check-edge-isolated.py "$path" fib-test

  live-readonly:
    if: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' && inputs.confirmation == 'CHECK' }}
    needs: [offline-contract, isolated-deno-fixture]
    runs-on: ubuntu-latest
    environment: fib-release
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.5.6
      - name: Compare actual deployed source with private Supabase CLI downloads
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SUPABASE_ACCESS_TOKEN"
          python3 scripts/backup/read-only-edge-check.py
