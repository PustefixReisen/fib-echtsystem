name: Editorial Web CI

on:
  pull_request:
    paths:
      - 'apps/editorial-web/**'
      - 'package.json'
      - 'tsconfig.base.json'
      - '.github/workflows/editorial-web-ci.yml'
  push:
    branches: [main]
    paths:
      - 'apps/editorial-web/**'
      - 'package.json'
      - 'tsconfig.base.json'
      - '.github/workflows/editorial-web-ci.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/editorial-web/package.json
      - name: Install dependencies
        run: npm install
      - name: Build editorial web
        run: npm run build --workspace @fib/editorial-web
