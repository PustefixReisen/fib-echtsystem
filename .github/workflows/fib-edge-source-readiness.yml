name: FIB Edge source recovery readiness (read-only)

# This is a diagnostic, not a release workflow or a backup receipt.
# The check uses existing environment-protected management credentials.
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type CHECK to read and validate currently deployed FIB sources'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fib-edge-source-readiness
  cancel-in-progress: false

jobs:
  edge-readiness:
    if: ${{ github.ref == 'refs/heads/main' && inputs.confirmation == 'CHECK' }}
    environment: fib-release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Read and independently compare live FIB Edge source files
        shell: bash
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$SUPABASE_ACCESS_TOKEN"
          mkdir -m 700 "$RUNNER_TEMP/fib-edge-readiness"
          # All exports and third-party CLI output stay private on the runner.
          # No release flag or review evidence is set.
          python3 scripts/backup/export-deployed-edge.py \
            --private-output "$RUNNER_TEMP/fib-edge-readiness/captured"
      - name: Erase private source files regardless of test result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$RUNNER_TEMP/fib-edge-readiness"
