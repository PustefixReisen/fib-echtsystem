name: U4 public-source connectivity check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/u4-source-smoke.mjs"
      - "packages/fachservices/src/u4-source-discovery.ts"
      - "tests/u4/source-discovery.spec.ts"
      - "tests/u4/ris-batch-persistence.spec.ts"
      - "packages/fachservices/src/u4-ris-batch-persistence.ts"
      - "tests/u4/ris-cursor-sql.spec.ts"
      - "packages/fachservices/src/u4-ris-cursor-sql.ts"
      - "tests/u4/ris-window-scan.spec.ts"
      - "packages/fachservices/src/u4-ris-window-scan.ts"
      - "tests/u4/ris-release-history.spec.ts"
      - "packages/fachservices/src/u4-ris-release-history.ts"
      - "tests/u4/ris-agenda-evidence.spec.ts"
      - "packages/fachservices/src/u4-ris-agenda-evidence.ts"
      - "tests/u4/source-run-recovery.spec.ts"
      - "tests/u4/source-monitor-sql.spec.ts"
      - "packages/fachservices/src/u4-source-monitor-run.ts"
      - "packages/fachservices/src/u4-source-monitor-sql.ts"
      - ".github/workflows/u4-source-smoke.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe Gemeinde and RIS endpoints
        run: node scripts/u4-source-smoke.mjs
      - name: Install workspace dependencies
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: Verify U4 source parser tests
        run: npm run test:u4
      - name: Verify core type contracts
        run: npm run typecheck:core
