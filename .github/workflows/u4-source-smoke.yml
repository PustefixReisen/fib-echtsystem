name: U4 public-source connectivity check
on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/u4-source-smoke.mjs"
      - ".github/workflows/u4-source-smoke.yml"
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Probe Gemeinde and RIS endpoints
        run: node scripts/u4-source-smoke.mjs
