name: Release backup contracts
on:
  pull_request:
    paths: ['scripts/backup/**', 'tests/backup/**', 'tests/u4/release-backup.spec.mjs', 'tests/u4/frontend-backup.spec.py', 'tests/u4/complete-backup.spec.py', 'tests/u4/backup-database-tls.spec.mjs', 'scripts/ris-shared-apps/io.mjs', '.github/workflows/complete-backup.yml', '.github/workflows/ris-correction-release.yml', '.github/workflows/frontend-backup.yml', '.github/workflows/editorial-web-deploy.yml', '.github/workflows/release-backup-tests.yml']
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - run: node tests/u4/release-backup.spec.mjs
      - run: node tests/u4/ris-original-export.spec.mjs
      - run: bash -n scripts/backup/create.sh
      - run: python3 tests/u4/frontend-backup.spec.py
      - run: python3 tests/u4/complete-backup.spec.py
      - run: python3 tests/backup/export-deployed-edge.test.py
      - run: python3 tests/backup/check-edge-isolated.test.py
      - run: python3 tests/backup/stage-reviewed-input.test.py
      - run: node tests/backup/capture-source-state.spec.mjs
      - run: python3 tests/backup/capture-feature-flags.test.py
      - run: python3 tests/backup/orchestrated-release.test.py
      - name: Validate reusable backup and RIS release workflow structure with actionlint
        run: |
          set -euo pipefail
          docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12 \
            .github/workflows/complete-backup.yml \
            .github/workflows/ris-correction-release.yml
      - run: python3 tests/backup/check-ris-deploy-drift.test.py
      - run: node tests/u4/backup-database-tls.spec.mjs

  isolated-deno-fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: 2.5.6
      - name: Reconstruct and typecheck a synthetic FIB function without project access
        shell: bash
        run: |
          set -euo pipefail
          export TEST_EDGE_DIR="$(mktemp -d)"
          trap 'rm -rf "$TEST_EDGE_DIR"' EXIT
          mkdir -p "$TEST_EDGE_DIR/fib-test"
          printf '%s\\n' 'export const value: number = 1;' > "$TEST_EDGE_DIR/fib-test/index.ts"
          python3 scripts/backup/check-edge-isolated.py "$TEST_EDGE_DIR" fib-test
