name: Deploy FIB Edge Functions

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Enter DEPLOY to publish the approved FIB Edge Functions to Shared-Apps'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: fib-shared-apps-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: fib-shared-apps
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy FIB functions to Shared-Apps
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          project_ref=apaubomxffcwtzjimori
          for function in fib-coordination fib-editorial-write fib-session-context fib-admin-users; do
            supabase functions deploy "$function" --project-ref "$project_ref" --no-verify-jwt
          done

      - name: Confirm deployment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions list --project-ref apaubomxffcwtzjimori
