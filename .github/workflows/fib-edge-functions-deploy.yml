name: Deploy FIB Edge Functions

on:
  workflow_dispatch:
    inputs:
      operation:
        description: 'Separate administrative operation; invitation never deploys functions'
        required: true
        default: deploy-functions
        type: choice
        options:
          - deploy-functions
          - check-invite-access
          - invite-preview-test
      confirmation:
        description: 'DEPLOY, CHECK_ACCESS, or INVITE_PREVIEW_TEST for the selected operation'
        required: true
        type: string
      expected_sha:
        description: 'Invitation operations only: exact reviewed 40-character workflow commit'
        type: string
      test_email:
        description: 'Send only: owner-confirmed NEW test address; never an existing account'
        type: string

permissions:
  contents: read

concurrency:
  group: fib-shared-apps-edge-functions
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ (inputs.operation == 'deploy-functions' || inputs.operation == '') && inputs.confirmation == 'DEPLOY' }}
    runs-on: ubuntu-latest
    environment: fib-shared-apps
    steps:
      - uses: actions/checkout@v4

      - name: Check configuration
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; }

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Deploy FIB functions to Shared-Apps
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -euo pipefail
          project_ref=apaubomxffcwtzjimori
          for function in fib-coordination fib-editorial-write fib-session-context; do
            supabase functions deploy "$function" --project-ref "$project_ref" --no-verify-jwt
          done

      - name: Confirm deployment
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          supabase functions list --project-ref apaubomxffcwtzjimori

  preview-invitation:
    if: ${{ (inputs.operation == 'check-invite-access' && inputs.confirmation == 'CHECK_ACCESS') || (inputs.operation == 'invite-preview-test' && inputs.confirmation == 'INVITE_PREVIEW_TEST') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    environment: fib-shared-apps
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run bounded invitation operator (no dependency installation)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/admin/preview-invite.mjs
