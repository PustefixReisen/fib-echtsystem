name: U4 PostgreSQL integration
on:
  pull_request:
    paths:
      - 'packages/fachservices/src/u4-source-monitor-run.ts'
      - 'packages/fachservices/src/u4-source-monitor-sql.ts'
      - 'tests/u4/postgres-integration.spec.ts'
      - 'tests/u4/ris-postgres-recovery.spec.ts'
      - 'tests/u4/ris-postgres-advisory-lock.spec.ts'
      - 'scripts/ris-scheduler-preflight.ts'
      - 'scripts/ris-cron-plan.ts'
      - '.github/workflows/u4-postgres-integration.yml'
      - 'package.json'
      - 'supabase/functions/fib-u4-pilot/**'
      - 'supabase/functions/_shared/u4-news.ts'
      - 'tests/u4/news-postgres-integration.spec.ts'
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration_only
          POSTGRES_DB: fib_u4_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: U4 repeat, outage and recovery against real PostgreSQL
        env:
          U4_TEST_DATABASE_URL: postgres://postgres:integration_only@localhost:5432/fib_u4_test
        run: npx tsx tests/u4/postgres-integration.spec.ts
      - name: RIS handler failure, recovery and rollback against real PostgreSQL
        env:
          U4_TEST_DATABASE_URL: postgres://postgres:integration_only@localhost:5432/fib_u4_test
        run: npx tsx tests/u4/ris-postgres-recovery.spec.ts

      - name: RIS scheduler session-lock contention with real PostgreSQL
        env:
          U4_TEST_DATABASE_URL: postgres://postgres:integration_only@localhost:5432/fib_u4_test
        run: npx tsx tests/u4/ris-postgres-advisory-lock.spec.ts

      - name: RIS schedule read-only preflight (isolated PostgreSQL)
        env:
          FIB_DATABASE_URL: postgres://postgres:integration_only@localhost:5432/fib_u4_test
        run: npm run u4:ris:preflight

      - name: Verify static RIS Cron plan never activates a job
        run: npm run u4:ris:cron-plan

      - name: Gemeinde Edge handler against isolated PostgreSQL
        env:
          U4_TEST_DATABASE_URL: postgres://postgres:integration_only@localhost:5432/fib_u4_test
        run: npx tsx tests/u4/news-postgres-integration.spec.ts
