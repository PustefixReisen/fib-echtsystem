name: Personal RIS acceptance preparation
on:
  pull_request:
    paths:
      - 'scripts/ris-acceptance/**'
      - 'tests/ris-e2e/**'
      - 'apps/editorial-web/**'
      - 'supabase/**'
      - 'package.json'
      - '.github/workflows/ris-user-acceptance.yml'
permissions:
  contents: read
jobs:
  manual-start-resume:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-package-lock --no-audit --no-fund
      - run: npm install --no-save --ignore-scripts --no-package-lock playwright@1.56.1
      - name: Use canonical Ubuntu package mirrors for Playwright dependencies
        run: |
          set -euo pipefail
          # GitHub hosted 24.04 runners sometimes refer to a transiently unresolvable Azure mirror.
          # Keep dependency installation and browser tests enabled; change only the apt mirror.
          for source in /etc/apt/sources.list /etc/apt/sources.list.d/ubuntu.sources; do
            if [ -f "$source" ]; then
              sudo sed -i 's|azure.archive.ubuntu.com|archive.ubuntu.com|g' "$source"
            fi
          done
          sudo apt-get update -o Acquire::Retries=3
      - run: npx playwright install --with-deps chromium
      - run: node tests/ris-e2e/originals.spec.mjs
      - name: Real personal launcher, login and persistent restart (synthetic PDF transport)
        run: node tests/ris-e2e/manual.smoke.mjs
      # Deliberately no artifact upload: no account, private state, PDF or database export.
      - name: Destroy isolated manual test data even after failure
        if: always()
        run: |
          TEST_DB_PASSWORD=cleanup TEST_JWT_SECRET=cleanup docker compose --project-name fib-ris-acceptance -f tests/ris-e2e/compose.yml -f scripts/ris-acceptance/compose.yml down --volumes --remove-orphans
